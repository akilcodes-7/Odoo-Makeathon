<dialog class="confirmation-dialog" data-confirmation-dialog aria-labelledby="confirmation-dialog-title" aria-describedby="confirmation-dialog-message">
  <div class="dialog-content">
    <h2 id="confirmation-dialog-title">Please confirm</h2>
    <p id="confirmation-dialog-message">Are you sure you want to continue?</p>
    <div class="dialog-actions">
      <button class="button button--secondary" type="button" data-confirm-cancel>Cancel</button>
      <button class="button button--danger" type="button" data-confirm-accept>Continue</button>
    </div>
  </div>
</dialog>
