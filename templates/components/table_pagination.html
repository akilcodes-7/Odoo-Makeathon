{% if page_obj and page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Pagination">
    <span class="pagination-summary">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    <div class="pagination-controls">
      {% if page_obj.has_previous %}<a class="button button--secondary button--small" href="?page={{ page_obj.previous_page_number }}{% if query_string %}&amp;{{ query_string }}{% endif %}" rel="prev">Previous</a>{% else %}<span class="button button--secondary button--small is-disabled" aria-disabled="true">Previous</span>{% endif %}
      {% if page_obj.has_next %}<a class="button button--secondary button--small" href="?page={{ page_obj.next_page_number }}{% if query_string %}&amp;{{ query_string }}{% endif %}" rel="next">Next</a>{% else %}<span class="button button--secondary button--small is-disabled" aria-disabled="true">Next</span>{% endif %}
    </div>
  </nav>
{% endif %}
