{% if messages %}
  <div class="message-stack">
    {% for message in messages %}
      <div class="message message--{{ message.tags|default:'info' }}" role="{% if 'error' in message.tags or 'warning' in message.tags %}alert{% else %}status{% endif %}" data-message>
        <span class="message-icon" aria-hidden="true">
          {% if 'success' in message.tags %}✓{% elif 'error' in message.tags or 'warning' in message.tags %}!{% else %}i{% endif %}
        </span>
        <p>{{ message }}</p>
        <button class="message-dismiss" type="button" aria-label="Dismiss message" data-dismiss-message>×</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
