<div class="form-field{% if field.errors %} has-error{% endif %}">
  <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span>{% endif %}</label>
  {% if field.help_text %}<div class="field-help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</div>{% endif %}
  {{ field }}
  {% if field.errors %}<div class="field-errors" id="{{ field.id_for_label }}_errors">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
