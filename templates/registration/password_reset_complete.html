{% extends "base.html" %}
{% block title %}Password updated{% endblock %}
{% block page_title %}Password updated{% endblock %}
{% block content %}
<div style="display: flex; justify-content: center; padding: 20px 0 40px;">
  <section class="card" style="width: 100%; max-width: 440px; padding: 36px 32px; box-shadow: var(--shadow-popover); border-radius: 20px; text-align: center;">
    <div class="brand-mark" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 24px; border-radius: 12px; background: rgba(52, 199, 89, 0.15); color: var(--apple-green);">✓</div>
    <h2 style="margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.03em;">Password updated</h2>
    <p style="margin: 12px 0 24px; color: var(--muted); font-size: 13.5px; line-height: 1.5;">Your password has been reset successfully. You can now sign in with your new credentials.</p>
    <a class="button button--primary" href="{% url 'accounts:login' %}" style="width: 100%; min-height: 44px; justify-content: center;">
      Sign in
    </a>
  </section>
</div>
{% endblock %}
